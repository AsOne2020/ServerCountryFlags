modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
displayURL = "https://github.com/Khajiitos/ServerCountryFlags"
authors = "Khajiitos"
description = "Shows the flag of where a server is located."
logoFile = "icon.png"

[[dependencies."${id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "servercountryflags.mixins.json"
